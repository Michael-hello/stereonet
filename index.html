<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stereonet project</title>
    <script type="module" crossorigin src="./assets/index-C8z5TKoL.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D0_kjVtI.css">
  </head>
  <body>
    <div id="app">

      <h4>Stereonet visualiser</h4>

      <div id="controls">
        <div class="row">
          <span>Type:</span>
          <select name="feature" id="type" class="buffer" >
            <option value="">--Choose a type--</option>
            <option value="plane">Plane</option>
            <option value="point">Point</option>
          </select>

          <span>Dip:</span>
          <input placeholder="Enter value" name="name" id="dip" class="buffer" autocomplete="off" />

          <span>Strike:</span>
          <input placeholder="Enter value" name="name" id="strike" class="buffer" autocomplete="off" />

          <button id="addFeature">Add Feature</button>
        </div>

        <div class="row">
          <span>View:</span>
          <div>
            <input type="radio" id="3D" name="view" value="3D" checked class="radio" />
            <label for="3D">3D</label>
          </div>
        
          <div style="margin-right: 60px;">
            <input type="radio" id="2D" name="view" value="2D" class="radio" />
            <label for="2D">2D</label>
          </div>

          <button id="showTable">View table</button>
          
          <!-- HIDE projection options for now -->
          <span class="hide">Projection:</span>
          <div class="hide">
            <input type="radio" id="angle" name="projection" value="angle" checked class="radio" disabled="true" />
            <label for="angle">Equal-angle</label>
          </div>
        
          <div class="hide">
            <input type="radio" id="area" name="projection" value="area" class="radio" disabled="true" />
            <label for="area">Equal-area</label>
          </div>
        </div>
      </div>

      <div id="mobile-controls">
        <span style="color: white;">Stereonet options available on larger screens.</span>
      </div>

      <div id="three"></div>


      <div id="myModal" class="modal">
         
        <div class="modal-content">
          <span id="closeModal">&times;</span>

          <div class="modal-row header" style="height: 35px;">
            <span>Dip</span>
            <span>Strike</span>
            <span>Type</span>
            <span style="border: none; background-color: white;"></span>
          </div> 

          <div id="rowToCopy" class="modal-row" style="height: 35px;">
            <span class="txt-bx box1"></span>
            <span class="txt-bx box2"></span>
            <span class="txt-bx box3"></span>
            <button class="delete-btn">DELETE</button>
          </div>          
        </div>

      </div>

    </div>
  </body>
</html>
